<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>レストラン ビリーブ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap');
  body {
    margin: 0;
    background: #fafaf7;
    color: #333;
    font-family: 'Noto Sans JP', sans-serif;
    line-height: 1.6;
  }
  header {
    background-color: #455a64;
    color: #f0f0f0;
    padding: 1rem 1.5rem;
    text-align: center;
  }
  header h1 {
    margin: 0;
    font-weight: 700;
    font-size: 1.8rem;
    letter-spacing: 0.05em;
  }
  main {
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1rem 3rem;
  }
  section {
    background-color: #fff;
    border-radius: 8px;
    box-shadow: 0 3px 8px rgb(0 0 0 / 0.07);
    padding: 1.8rem 2rem;
    margin-bottom: 2rem;
  }
  h2 {
    font-weight: 600;
    font-size: 1.3rem;
    border-bottom: 2px solid #455a64;
    padding-bottom: 0.3rem;
    margin-bottom: 1rem;
    color: #2e3b43;
  }
  dl {
    display: flex;
    flex-wrap: wrap;
  }
  dt {
    flex-basis: 35%;
    font-weight: 600;
    color: #455a64;
    margin-bottom: 0.8rem;
  }
  dd {
    flex-basis: 65%;
    margin: 0 0 0.8rem 0;
    word-break: break-word;
    color: #444;
  }
  .btns {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
  }
  button, .btn-link {
    flex: 1 1 120px;
    background-color: #607d8b;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    padding: 0.75rem;
    cursor: pointer;
    transition: background-color 0.3s ease;
    text-decoration: none;
    text-align: center;
    user-select: none;
  }
  button:hover, .btn-link:hover {
    background-color: #455a64;
  }
  footer {
    font-size: 0.75rem;
    color: #999999;
    text-align: center;
    margin: 3rem 1rem 2rem;
    user-select: none;
  }
  @media (max-width: 600px) {
    dt, dd {
      flex-basis: 100%;
    }
    .btns {
      flex-direction: column;
    }
    button, .btn-link {
      flex-basis: auto;
    }
  }
</style>
</head>
<body>
<header>
  <h1>レストラン ビリーブ</h1>
</header>
<main>
  <section aria-labelledby="store-info">
    <h2 id="store-info">店舗情報</h2>
    <dl>
      <dt>業種</dt>
      <dd>レストラン</dd>
      <dt>所在地</dt>
      <dd>〒680-0941 鳥取県鳥取市湖山町北1丁目41 9 セレナール IZUMI</dd>
      <dt>地域</dt>
      <dd>鳥取県鳥取市湖山町北</dd>
      <dt>電話番号</dt>
      <dd>0857-31-4936</dd>
      <dt>Instagram</dt>
      <dd>あり（詳細は店舗へご確認ください）</dd>
      <dt>公式ホームページ</dt>
      <dd>現在Instagramのみの運用となります</dd>
      <dt>GoogleマップURL</dt>
      <dd>現在ご案内できるURLはございません</dd>
    </dl>
  </section>
  <section aria-label="店舗への連絡">
    <h2>お問い合わせ・アクセス</h2>
    <div class="btns">
      <button type="button" aria-label="電話をかける" onclick="location.href='tel:0857314936'">電話をかける</button>
      <button type="button" aria-label="GoogleマップのURLは未設定のため表示不可" disabled style="background-color:#ccc;cursor:not-allowed;">Googleマップで見る<br><small>（URL未設定）</small></button>
    </div>
  </section>
  <section aria-label="お知らせ">
    <h2>お知らせ</h2>
    <p>現在の営業時間、メニュー、料金等の詳細は店舗へご確認ください。</p>
  </section>
</main>
<footer>
  <p>※本ページは営業提案用のデモサイトです。</p>
</footer>
</body>
</html>
